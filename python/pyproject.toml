[project]
name = "apiverve-advicegenerator"
version = "1.2.2"
authors = [
  { name="APIVerve", email="hello@apiverve.com" },
]
description = "Advice Generator supplies random pieces of advice on demand. Each response includes a unique advice identifier, the advice quote, and the language code."
keywords = ["random advice api", "advice generator", "get random advice", "random advice quotes", "random tips generator"]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "requests>=2.25.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
]

[project.urls]
Homepage = "https://apiverve.com/marketplace/advice?utm_source=pypi&utm_medium=referral&utm_content=homepage"
Documentation = "https://docs.apiverve.com/ref/advice?utm_source=pypi&utm_medium=referral&utm_content=docs"
Repository = "https://github.com/apiverve/advice-api"
Twitter = "https://twitter.com/apivervehq"
